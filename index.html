// ───────────────────────────────────────────────────────────
// Google Calendar integration
// ───────────────────────────────────────────────────────────
const GCAL_SCOPE = 'https://www.googleapis.com/auth/calendar';

const loadGcalToken = () => {
  try {
    const raw = localStorage.getItem('planner:gcalToken');
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed.token || !parsed.expiry || parsed.expiry < Date.now()) return null;
    return parsed;
  } catch { return null; }
};
const saveGcalToken = (tokenObj) => localStorage.setItem('planner:gcalToken', JSON.stringify(tokenObj));
const clearGcalToken = () => localStorage.removeItem('planner:gcalToken');
// Separate from the token itself: remembers that the user granted access before,
// even after the short-lived access token has expired or the tab was closed.
const wasEverConnected = () => localStorage.getItem('planner:gcalConnected') === '1';
const markConnected = () => localStorage.setItem('planner:gcalConnected', '1');
const clearConnectedFlag = () => localStorage.removeItem('planner:gcalConnected');

function useGoogleAuth(clientId) {
  const [token, setToken] = useState(loadGcalToken);
  const [ready, setReady] = useState(false);
  const [needsReconnect, setNeedsReconnect] = useState(false);
  const tokenClientRef = useRef(null);

  useEffect(() => {
    if (!clientId) { setReady(false); return; }
    let timer;
    const init = () => {
      if (!window.google?.accounts?.oauth2) {
        timer = setTimeout(init, 200);
        return;
      }
      tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: GCAL_SCOPE,
        callback: (response) => {
          if (response.error) {
            // Silent renewal failed (e.g. interaction_required) — don't alert on
            // auto-attempts, just flag that the user needs to click "Войти" again.
            setNeedsReconnect(true);
            if (response.error !== 'interaction_required' && response.error !== 'access_denied') {
              console.error('OAuth error:', response);
            }
            return;
          }
          const t = {
            token: response.access_token,
            expiry: Date.now() + (response.expires_in - 60) * 1000,
          };
          saveGcalToken(t);
          markConnected();
          setNeedsReconnect(false);
          setToken(t);
        },
      });
      setReady(true);
      // If the user connected before but the access token isn't valid right now
      // (expired, or the tab was just reopened), try a silent renewal first —
      // no popup, no re-consent — before falling back to asking the user to click "Войти".
      if (!loadGcalToken() && wasEverConnected()) {
        tokenClientRef.current.requestAccessToken({ prompt: '' });
      }
    };
    init();
    return () => { if (timer) clearTimeout(timer); };
  }, [clientId]);

  const signIn = () => {
    if (!tokenClientRef.current) {
      alert('Google API ещё грузится, попробуй через секунду');
      return;
    }
    tokenClientRef.current.requestAccessToken({ prompt: token ? '' : 'consent' });
  };
  const signOut = () => {
    if (token?.token && window.google?.accounts?.oauth2) {
      window.google.accounts.oauth2.revoke(token.token, () => {});
    }
    clearGcalToken();
    clearConnectedFlag();
    setNeedsReconnect(false);
    setToken(null);
  };
  return { token, signIn, signOut, ready, needsReconnect };
}

async function gcalFetchRange(token, startISO, endISO) {
  const url = new URL('https://www.googleapis.com/calendar/v3/calendars/primary/events');
  url.searchParams.set('timeMin', startISO);
  url.searchParams.set('timeMax', endISO);
  url.searchParams.set('singleEvents', 'true');
  url.searchParams.set('orderBy', 'startTime');
  url.searchParams.set('maxResults', '100');
  const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('Calendar fetch: ' + res.status);
  const data = await res.json();
  return data.items || [];
}

async function gcalFetchEvents(token, ym, day) {
  const [y, m] = ym.split('-').map(Number);
  const start = new Date(y, m - 1, day, 0, 0, 0);
  const end = new Date(y, m - 1, day, 23, 59, 59);
  const url = new URL('https://www.googleapis.com/calendar/v3/calendars/primary/events');
  url.searchParams.set('timeMin', start.toISOString());
  url.searchParams.set('timeMax', end.toISOString());
  url.searchParams.set('singleEvents', 'true');
  url.searchParams.set('orderBy', 'startTime');
  const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('Calendar fetch failed: ' + res.status);
  const data = await res.json();
  return data.items || [];
}

async function gcalCreateEvent(token, task, ym, day) {
  const [y, m] = ym.split('-').map(Number);
  let start, end;
  if (task.time && /^\d{1,2}:\d{2}$/.test(task.time)) {
    const [h, mn] = task.time.split(':').map(Number);
    start = new Date(y, m - 1, day, h, mn, 0);
    end = new Date(start.getTime() + 60 * 60 * 1000);
  } else {
    // All-day
    start = { date: `${ym}-${String(day).padStart(2, '0')}` };
    const nextDay = new Date(y, m - 1, day + 1);
    end = { date: `${nextDay.getFullYear()}-${String(nextDay.getMonth() + 1).padStart(2, '0')}-${String(nextDay.getDate()).padStart(2, '0')}` };
  }
  const event = {
    summary: task.title || 'Задача',
    description: task.note || undefined,
    start: start instanceof Date ? { dateTime: start.toISOString() } : start,
    end: end instanceof Date ? { dateTime: end.toISOString() } : end,
  };
  const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(event),
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error('Calendar create failed: ' + res.status + ' ' + err);
  }
  return await res.json();
}

// Read file, auto-detect UTF-8 vs Windows-1251 encoding
const readFileSmart = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => {
    const buf = reader.result;
    let text = new TextDecoder('utf-8').decode(buf);
    // Mojibake detection — broken cyrillic looks like Ð Ñ Â or has replacement chars
    const sample = text.slice(0, 1000);
    if (text.includes('\uFFFD') || (/[\u00C0-\u00FF]{3,}/.test(sample) && !/[а-яА-Я]/.test(sample))) {
      try { text = new TextDecoder('windows-1251').decode(buf); } catch (e) {}
    }
    resolve(text);
  };
  reader.onerror = reject;
  reader.readAsArrayBuffer(file);
});

// Read an .xlsx/.xls file into an array-of-arrays (same shape Papa.parse gives us for CSV)
const readXlsxRows = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const wb = XLSX.read(reader.result, { type: 'array', cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
      resolve(rows.filter((r) => r.some((c) => String(c ?? '').trim() !== '')));
    } catch (e) { reject(e); }
  };
  reader.onerror = reject;
  reader.readAsArrayBuffer(file);
});

const isXlsxFile = (file) => /\.xlsx?$/i.test(file.name || '');

// Unified entry point: parses .csv, .xlsx or .xls into rows (array-of-arrays)
const parseStatementFile = async (file) => {
  if (isXlsxFile(file)) return await readXlsxRows(file);
  const text = await readFileSmart(file);
  const parsed = Papa.parse(text.trim(), { skipEmptyLines: true });
  return parsed.data;
};

const parseAmount = (s) => {
  if (s == null || s === '') return NaN;
  let c = String(s).replace(/\s/g, '').replace(/\u00A0/g, '').replace(/[^\d,.\-]/g, '');
  // if both comma and dot, assume dot is thousand sep
  if (c.includes(',') && c.includes('.')) c = c.replace(/\./g, '').replace(',', '.');
  else c = c.replace(',', '.');
  const n = parseFloat(c);
  return isNaN(n) ? NaN : n;
};

const RU_MONTHS_SHORT = {
  'янв': '01', 'фев': '02', 'мар': '03', 'апр': '04', 'май': '05', 'мая': '05',
  'июн': '06', 'июл': '07', 'авг': '08', 'сен': '09', 'окт': '10', 'ноя': '11', 'дек': '12',
};

const parseStatementDate = (s) => {
  if (!s) return null;
  if (s instanceof Date && !isNaN(s)) {
    return `${s.getFullYear()}-${String(s.getMonth() + 1).padStart(2, '0')}-${String(s.getDate()).padStart(2, '0')}`;
  }
  s = String(s).trim();
  // "01 июн. 2026, 08:58" / "01 июня 2026" — Russian month name
  let m = s.match(/(\d{1,2})\s+([а-яё]{3,})\.?\s+(\d{4})/i);
  if (m) {
    const key = m[2].toLowerCase().slice(0, 3);
    const mo = RU_MONTHS_SHORT[key];
    if (mo) return `${m[3]}-${mo}-${m[1].padStart(2, '0')}`;
  }
  m = s.match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/);
  if (m) {
    let [, d, mo, y] = m;
    if (y.length === 2) y = '20' + y;
    return `${y}-${mo.padStart(2, '0')}-${d.padStart(2, '0')}`;
  }
  m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
};

// Guess which columns are date / amount / description / category from header names
const guessColumnMapping = (rows) => {
  const map = { date: -1, amount: -1, desc: -1, cat: -1 };
  if (!rows || !rows.length) return map;
  const header = rows[0].map((h) => String(h || '').toLowerCase());
  header.forEach((h, i) => {
    if (map.date < 0 && /дата|date/.test(h)) map.date = i;
    else if (map.amount < 0 && /сумма|amount|оборот|расход/.test(h)) map.amount = i;
    else if (map.desc < 0 && /описан|назначен|получател|контрагент|description|^операция$/.test(h)) map.desc = i;
    else if (map.cat < 0 && /категор|источник|category|source/.test(h)) map.cat = i;
  });
  return map;
};

function CalendarWidget({ gcal }) {
  const [events, setEvents] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [days, setDays] = useState(7);

  const fetch14 = useCallback((d = days) => {
    if (!gcal?.token) return;
    setLoading(true); setError('');
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const end = new Date(start); end.setDate(end.getDate() + d); end.setHours(23, 59, 59, 999);
    gcalFetchRange(gcal.token.token, start.toISOString(), end.toISOString())
      .then(setEvents).catch((e) => setError(e.message)).finally(() => setLoading(false));
  }, [gcal?.token, days]);

  useEffect(() => { fetch14(); }, [gcal?.token]);

  const fmtTime = (ev) => {
    if (ev.start?.date) return 'весь день';
    if (!ev.start?.dateTime) return '';
    const d = new Date(ev.start.dateTime);
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  };

  const fmtDuration = (ev) => {
    if (!ev.start?.dateTime || !ev.end?.dateTime) return '';
    const diff = (new Date(ev.end.dateTime) - new Date(ev.start.dateTime)) / 60000;
    if (diff < 60) return `${diff} мин`;
    const h = Math.floor(diff / 60), m = diff % 60;
    return m ? `${h}ч ${m}м` : `${h}ч`;
  };

  const toLocalKey = (d) =>
    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  const dayList = useMemo(() => Array.from({ length: days }, (_, i) => {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + i);
    return d;
  }), [days]);

  const grouped = useMemo(() => {
    const map = {};
    events.forEach((ev) => {
      // Use local date key from event start — slice ISO string which preserves offset
      const raw = ev.start?.dateTime || ev.start?.date || '';
      // Parse to JS Date to get local date
      const d = new Date(raw);
      const k = isNaN(d) ? raw.slice(0, 10) : toLocalKey(d);
      (map[k] = map[k] || []).push(ev);
    });
    return map;
  }, [events]);

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);

  const dayLabel = (d) => {
    if (d.toDateString() === today.toDateString()) return 'Сегодня';
    if (d.toDateString() === tomorrow.toDateString()) return 'Завтра';
    return DOW_LONG[(d.getDay() + 6) % 7] + ', ' + d.getDate() + ' ' + MONTHS_RU[d.getMonth()].slice(0, 3).toLowerCase();
  };

  if (!gcal?.token) return (
    <div className="py-12 text-center space-y-2">
      <div className="text-sm text-neutral-500">
        {gcal?.needsReconnect ? 'Сессия Google Calendar истекла' : 'Google Calendar не подключён'}
      </div>
      <div className="text-xs text-neutral-400">
        {gcal?.needsReconnect
          ? 'Настройки → Google Calendar → Войти заново'
          : 'Настройки → Google Calendar → Подключить'}
      </div>
    </div>
  );

  if (loading) return (
    <div className="py-12 flex items-center justify-center gap-2 text-neutral-400">
      <Icon name="loader" className="w-5 h-5 animate-spin-slow" />
      <span className="text-sm">Загружаю события...</span>
    </div>
  );

  if (error) return (
    <div className="py-6 space-y-2">
      <div className="text-xs text-rose-600">{error}</div>
      <button onClick={() => fetch14()} className="text-xs text-accent hover:underline">Попробовать снова</button>
    </div>
  );

  const hasAny = dayList.some((d) => (grouped[d.toISOString().slice(0, 10)] || []).length > 0);

  return (
    <div className="space-y-5">
      {dayList.map((d) => {
        const key = toLocalKey(d);
        const evs = grouped[key] || [];
        const isToday = d.toDateString() === today.toDateString();
        if (!isToday && evs.length === 0) return null;
        return (
          <div key={key}>
            <div className={`flex items-center gap-2 mb-2`}>
              <span className={`text-[11px] font-bold tracking-[0.14em] uppercase ${isToday ? 'text-accent' : 'text-neutral-400'}`}>
                {dayLabel(d)}
              </span>
              {isToday && <span className="w-1.5 h-1.5 rounded-full bg-accent" />}
            </div>
            {evs.length === 0 ? (
              <div className="text-xs text-neutral-300 pl-3 border-l border-neutral-100">Нет событий</div>
            ) : (
              <div className="space-y-1.5">
                {evs.map((ev) => {
                  const time = fmtTime(ev);
                  const dur = fmtDuration(ev);
                  return (
                    <div key={ev.id} className={`flex items-start gap-3 pl-3 py-1.5 rounded-r-lg border-l-2 transition-colors hover:bg-neutral-50 ${isToday ? 'border-accent/60' : 'border-neutral-200'}`}>
                      <div className="flex flex-col items-end w-14 flex-shrink-0 pt-0.5">
                        <span className="text-xs font-mono text-neutral-500">{time}</span>
                        {dur && <span className="text-[10px] text-neutral-300">{dur}</span>}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="text-sm text-neutral-800 leading-snug">{ev.summary || '(без названия)'}</div>
                        {ev.location && <div className="text-xs text-neutral-400 truncate mt-0.5">{ev.location}</div>}
                        {ev.description && (
                          <div className="text-xs text-neutral-400 mt-0.5 line-clamp-1">{ev.description.replace(/<[^>]*>/g, '').slice(0, 80)}</div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}

      {!hasAny && <div className="text-sm text-neutral-400 py-8 text-center">Нет событий на ближайшие {days} дней</div>}

      <div className="flex items-center justify-between pt-2 border-t border-line-soft">
        <div className="flex gap-1">
          {[7, 14, 30].map((n) => (
            <button key={n} onClick={() => { setDays(n); fetch14(n); }}
              className={`text-xs px-2.5 py-1 rounded-md transition-colors ${days === n ? 'bg-accent/10 text-accent font-medium' : 'text-neutral-400 hover:text-neutral-700'}`}>
              {n} дней
            </button>
          ))}
        </div>
        <button onClick={() => fetch14()} className="text-xs text-neutral-400 hover:text-accent transition-colors inline-flex items-center gap-1">
          <Icon name="repeat" className="w-3 h-3" /> Обновить
        </button>
      </div>
    </div>
  );
}
